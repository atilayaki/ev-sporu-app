{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto text-center py-12" x-data="breatheApp()">
    <h1 class="text-4xl font-extrabold mb-4 text-white">4-7-8 Nefes Egzersizi</h1>
    <p class="text-gray-400 mb-12">Zihninizi boşaltın, kalp ritminizi yavaşlatın ve rahatlayın.</p>

    <div class="relative w-64 h-64 mx-auto mb-12 flex items-center justify-center">
        <!-- The expanding/shrinking circle -->
        <div class="absolute inset-0 bg-accent rounded-full opacity-20 transition-all ease-linear"
             :style="'transform: scale(' + circleScale + '); transition-duration: ' + transitionDuration + 'ms;'"></div>
        
        <!-- Inner static circle with text -->
        <div class="absolute w-40 h-40 bg-cardbg rounded-full border-4 border-accent flex flex-col items-center justify-center z-10 shadow-lg shadow-accent/20">
            <span class="text-2xl font-bold text-white mb-1" x-text="instructionText">Hazır</span>
            <span class="text-3xl font-extrabold text-accent" x-text="countdown">0</span>
        </div>
    </div>

    <button @click="toggleBreathing()" class="px-8 py-3 bg-accent text-white font-bold rounded-lg hover:bg-orange-500 transition shadow-lg shadow-orange-500/30">
        <span x-text="isActive ? 'Durdur' : 'Başla'"></span>
    </button>
</div>

<script>
function breatheApp() {
    return {
        isActive: false,
        instructionText: 'Başlamak için tıklayın',
        countdown: 4,
        circleScale: 1,
        transitionDuration: 0,
        interval: null,
        
        toggleBreathing() {
            if (this.isActive) {
                this.stop();
            } else {
                this.start();
            }
        },

        stop() {
            this.isActive = false;
            clearInterval(this.interval);
            this.instructionText = 'Durduruldu';
            this.countdown = 0;
            this.circleScale = 1;
            this.transitionDuration = 500;
        },

        start() {
            this.isActive = true;
            this.breatheIn();
        },

        breatheIn() {
            if (!this.isActive) return;
            this.instructionText = 'Nefes Al';
            this.countdown = 4;
            this.circleScale = 1.8;
            this.transitionDuration = 4000;
            
            this.tickCountdown(() => this.hold());
        },

        hold() {
            if (!this.isActive) return;
            this.instructionText = 'Tut';
            this.countdown = 7;
            this.circleScale = 1.8;
            this.transitionDuration = 0;
            
            this.tickCountdown(() => this.breatheOut());
        },

        breatheOut() {
            if (!this.isActive) return;
            this.instructionText = 'Nefes Ver';
            this.countdown = 8;
            this.circleScale = 1;
            this.transitionDuration = 8000;
            
            this.tickCountdown(() => this.breatheIn());
        },

        tickCountdown(nextStepCallback) {
            clearInterval(this.interval);
            this.interval = setInterval(() => {
                if (!this.isActive) {
                    clearInterval(this.interval);
                    return;
                }
                this.countdown--;
                if (this.countdown <= 0) {
                    clearInterval(this.interval);
                    nextStepCallback();
                }
            }, 1000);
        }
    }
}
</script>
{% endblock %}
